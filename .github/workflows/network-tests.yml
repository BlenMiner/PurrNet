name: Network Tests

on:
  workflow_dispatch:
    inputs:
      clientCount:
        description: "Total players per mode (default batches require at least 3)"
        required: true
        default: "5"
      connectionDelaySeconds:
        description: "Seconds to wait after server starts before launching clients"
        required: true
        default: "1"
      timeoutMinutes:
        description: "Hard timeout for the whole job, in minutes"
        required: true
        default: "30"
      scenario:
        description: "Run one scenario by name (empty runs the full suite and isolated regressions)"
        required: false
        default: ""
  workflow_call:
    inputs:
      clientCount:
        type: string
        required: false
        default: "3"
      connectionDelaySeconds:
        type: string
        required: false
        default: "1"
      timeoutMinutes:
        type: string
        required: false
        default: "30"
      player_artifact:
        description: "Name of a prebuilt StandaloneLinux64 player artifact to reuse instead of building."
        type: string
        required: false
        default: ""
      scenario:
        description: "Run one scenario by name (empty runs the full suite and isolated regressions)."
        type: string
        required: false
        default: ""

jobs:
  network-tests:
    name: ${{ matrix.mode }} mode
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeoutMinutes) }}
    strategy:
      fail-fast: false
      matrix:
        # "server" runs a pure server process + N client processes.
        # "host" runs a host (server+client in one process) + N-1 client processes,
        # so the same total player count is exercised but the server and one client
        # share a process — same static state, same cookie store. Same-process
        # cookie sharing is what late-join / reconnect tests rely on.
        mode: [server, host]

    steps:
      # The tracked runner and scenario manifest are needed even with a prebuilt player.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scenario runner
        run: bash .github/scripts/test-network-tests.sh

      - name: Validate host-loss process supervision
        run: python3 .github/scripts/test-host-loss.py

      - name: Validate content cache cleanup
        run: bash .github/scripts/test-reset-addressable-build-caches.sh

      # Reuse a player built upstream (e.g. by the benchmark workflow) instead of building again.
      - name: Download prebuilt player
        if: inputs.player_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.player_artifact }}
          path: build/StandaloneLinux64

      - name: Restore Library cache
        if: inputs.player_artifact == ''
        id: cache-library
        uses: actions/cache/restore@v4
        with:
          path: Library
          # Standalone network-tests always build release IL2CPP -> share the 'rel' cache with the
          # release benchmark build (dev builds use a separate 'dev' cache; see benchmark.yml).
          key: Library-PurrNet-IL2CPP-rel-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-PurrNet-IL2CPP-rel-

      - name: Reset content caches after fallback Library restore
        if: inputs.player_artifact == '' && steps.cache-library.outputs.cache-hit != 'true'
        run: bash .github/scripts/reset-addressable-build-caches.sh "$GITHUB_WORKSPACE"

      - name: Build StandaloneLinux64 player (IL2CPP)
        if: inputs.player_artifact == ''
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneLinux64
          buildName: PurrNetTests
          buildsPath: build
          unityVersion: auto
          # IL2CPP is slower to build than Mono but exercises the IL -> C++
          # converter against our codegen output, which surfaces issues that
          # Mono silently tolerates.
          customParameters: -standaloneBuildSubtarget Player -scriptingBackend IL2CPP

      - name: Save Library cache
        if: always() && inputs.player_artifact == '' && steps.cache-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.cache-library.outputs.cache-primary-key }}

      - name: Inspect build output
        run: ls -la build/StandaloneLinux64/

      - name: Run scenarios
        id: scenarios
        env:
          CLIENT_COUNT: ${{ inputs.clientCount }}
          CONNECT_DELAY: ${{ inputs.connectionDelaySeconds }}
          MODE: ${{ matrix.mode }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          BIN="$PWD/build/StandaloneLinux64/PurrNetTests"
          # unity-builder can produce the binary as a different container user.
          sudo chmod +x "$BIN" || chmod +x "$BIN" || true
          bash .github/scripts/network-tests.sh

      - name: Render results to job summary
        if: always()
        env:
          MODE: ${{ matrix.mode }}
          RUN_OUTCOME: ${{ steps.scenarios.outcome }}
        run: |
          set -u
          shopt -s nullglob
          # Crash readiness/injection markers are metadata, not peer result arrays.
          files=(test-results/*/server.json test-results/*/host.json test-results/*/client-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            {
              echo "## Network Test Results"
              echo ""
              echo "_No result files were produced._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          JQ_LIB='
            def humanBytes:
              if . < 1024 then "\(.) B"
              elif . < 1048576 then "\(((. * 10) / 1024 | floor) / 10) KB"
              else "\(((. * 100) / 1048576 | floor) / 100) MB" end;
            def humanDuration:
              if . < 1000 then "\(((. * 10) | floor) / 10)ms"
              else "\(((. * 100) / 1000 | floor) / 100)s" end;
            def statusIcon:
              if . then ":white_check_mark:" else ":x:" end;
          '

          total=0
          passed=0
          for f in "${files[@]}"; do
            count=$(jq 'length' "$f")
            pass=$(jq '[.[] | select(.result.success == true)] | length' "$f")
            total=$((total + count))
            passed=$((passed + pass))
          done
          failed=$((total - passed))

          {
            echo "## Network Test Results — ${MODE} mode"
            echo ""
            if [ "$RUN_OUTCOME" != "success" ]; then
              echo "### :x: Runner or result validation failed — ${passed}/${total} recorded entries passed"
            elif [ "$failed" -eq 0 ]; then
              echo "### :white_check_mark: All scenarios passed (${passed}/${total})"
            else
              echo "### :x: ${failed} failure(s) — ${passed}/${total} passed"
            fi
            echo ""

            for f in "${files[@]}"; do
              batch=$(basename "$(dirname "$f")")
              proc="$batch/$(basename "$f" .json)"
              pcount=$(jq 'length' "$f")
              ppass=$(jq '[.[] | select(.result.success == true)] | length' "$f")
              pfail=$((pcount - ppass))

              # Client tables get loud with N near-identical rows; only show failed scenarios
              # for clients. The server/host file always renders in full so it's clear which
              # scenarios actually ran and how the authoritative side viewed each one.
              case "$proc" in
                */client-*) is_client=1 ;;
                *)        is_client=0 ;;
              esac

              if [ "$is_client" -eq 1 ]; then
                if [ "$pfail" -eq 0 ]; then
                  echo "#### \`${proc}\` — ${ppass}/${pcount} passed :white_check_mark:"
                  echo ""
                  echo "_All scenarios passed; rows omitted._"
                  echo ""
                  continue
                fi
                echo "#### \`${proc}\` — ${pfail} failed (${ppass}/${pcount} passed)"
              else
                echo "#### \`${proc}\` — ${ppass}/${pcount} passed"
              fi
              echo ""
              echo "| # | Scenario | Status | Duration | Sent | Received | Message |"
              echo "|---|---|---|---|---|---|---|"

              FILTER='to_entries[]'
              if [ "$is_client" -eq 1 ]; then
                FILTER='to_entries[] | select(.value.result.success == false)'
              fi

              jq -r "$JQ_LIB"'
                '"$FILTER"' |
                "| \(.key) | \(.value.name // "?") | \(.value.result.success | statusIcon) | \(.value.durationInMs | humanDuration) | \(.value.dataSent | humanBytes) | \(.value.dataReceived | humanBytes) | \((.value.result.message // "") | gsub("\\|"; "&#124;") | gsub("[\\r\\n]+"; " ")) |"
              ' "$f"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tail logs on failure
        if: failure()
        run: |
          for f in test-logs/*/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f (last 200 lines)"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-test-artifacts-${{ matrix.mode }}
          path: |
            test-results/
            test-logs/
          if-no-files-found: warn
          retention-days: 14
