name: Network Tests

on:
  workflow_dispatch:
    inputs:
      clientCount:
        description: "Number of client processes to spawn"
        required: true
        default: "5"
      connectionDelaySeconds:
        description: "Seconds to wait after server starts before launching clients"
        required: true
        default: "1"
      timeoutMinutes:
        description: "Hard timeout for the whole job, in minutes"
        required: true
        default: "30"
      scenario:
        description: "Run a single scenario component by name (empty runs the full suite)"
        required: false
        default: ""
  workflow_call:
    inputs:
      clientCount:
        type: string
        required: false
        default: "3"
      connectionDelaySeconds:
        type: string
        required: false
        default: "1"
      timeoutMinutes:
        type: string
        required: false
        default: "30"
      player_artifact:
        description: "Name of a prebuilt StandaloneLinux64 player artifact to reuse instead of building."
        type: string
        required: false
        default: ""
      scenario:
        description: "Run a single scenario component by name (empty runs the full suite)."
        type: string
        required: false
        default: ""

jobs:
  network-tests:
    name: ${{ matrix.mode }} mode
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeoutMinutes) }}
    strategy:
      fail-fast: false
      matrix:
        # "server" runs a pure server process + N client processes.
        # "host" runs a host (server+client in one process) + N-1 client processes,
        # so the same total player count is exercised but the server and one client
        # share a process — same static state, same cookie store. Same-process
        # cookie sharing is what late-join / reconnect tests rely on.
        mode: [server, host]

    steps:
      # Reuse a player built upstream (e.g. by the benchmark workflow) instead of building again.
      - name: Download prebuilt player
        if: inputs.player_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.player_artifact }}
          path: build/StandaloneLinux64

      - name: Checkout
        if: inputs.player_artifact == ''
        uses: actions/checkout@v4

      - name: Restore Library cache
        if: inputs.player_artifact == ''
        id: cache-library
        uses: actions/cache/restore@v4
        with:
          path: Library
          # Standalone network-tests always build release IL2CPP -> share the 'rel' cache with the
          # release benchmark build (dev builds use a separate 'dev' cache; see benchmark.yml).
          key: Library-PurrNet-IL2CPP-rel-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-PurrNet-IL2CPP-rel-

      - name: Build StandaloneLinux64 player (IL2CPP)
        if: inputs.player_artifact == ''
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneLinux64
          buildName: PurrNetTests
          buildsPath: build
          unityVersion: auto
          # IL2CPP is slower to build than Mono but exercises the IL -> C++
          # converter against our codegen output, which surfaces issues that
          # Mono silently tolerates.
          customParameters: -standaloneBuildSubtarget Player -scriptingBackend IL2CPP

      - name: Save Library cache
        if: always() && inputs.player_artifact == '' && steps.cache-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.cache-library.outputs.cache-primary-key }}

      - name: Inspect build output
        run: ls -la build/StandaloneLinux64/

      - name: Run scenarios
        env:
          CLIENT_COUNT: ${{ inputs.clientCount }}
          CONNECT_DELAY: ${{ inputs.connectionDelaySeconds }}
          MODE: ${{ matrix.mode }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -u
          BIN="$PWD/build/StandaloneLinux64/PurrNetTests"
          # The IL2CPP player is produced inside the unity-builder Docker container as a non-runner
          # user (e.g. 'packer') and is already +x. A plain chmod by the runner user fails with
          # EPERM ("Operation not permitted") and, under set -e, aborts the whole step before any
          # process launches. sudo (passwordless on GitHub runners) chmods regardless of owner.
          sudo chmod +x "$BIN" || chmod +x "$BIN" || true
          RESULTS_DIR="$PWD/test-results"
          LOGS_DIR="$PWD/test-logs"
          mkdir -p "$RESULTS_DIR" "$LOGS_DIR"

          # Total player count we want exercised, regardless of host vs server-only mode.
          TOTAL_COUNT="$CLIENT_COUNT"

          # Server-only: 1 server process + N client processes (server has N connections).
          # Host: 1 host process + (N-1) client processes (host has N connections, one
          # of which is its own local client; cookies + static state shared with server).
          if [ "$MODE" = "host" ]; then
            EXTERNAL_CLIENTS=$((TOTAL_COUNT - 1))
            if [ "$EXTERNAL_CLIENTS" -lt 1 ]; then
              echo "::error::Host mode needs at least 1 external client (clientCount must be >= 2). Got $TOTAL_COUNT"
              exit 1
            fi
          else
            EXTERNAL_CLIENTS="$TOTAL_COUNT"
          fi

          # Unity 6 Linux player segfaults inside PlayerMain on ubuntu-latest
          # even with -batchmode -nographics, so wrap each invocation in xvfb-run.
          RUN=(xvfb-run -a --server-args="-screen 0 1024x768x24")

          # Empty input -> full suite; otherwise every process runs just that scenario.
          SCENARIO_ARGS=()
          if [ -n "$SCENARIO" ]; then
            SCENARIO_ARGS=(-scenario "$SCENARIO")
            echo "Running single scenario: $SCENARIO"
          fi

          echo "::group::Launching $MODE process"
          "${RUN[@]}" "$BIN" -batchmode -nographics \
            -role "$MODE" -count "$TOTAL_COUNT" \
            "${SCENARIO_ARGS[@]}" \
            -results "$RESULTS_DIR/$MODE.json" \
            -logFile "$LOGS_DIR/$MODE.log" &
          SERVER_PID=$!
          echo "$MODE PID: $SERVER_PID"
          echo "::endgroup::"

          sleep "$CONNECT_DELAY"

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::$MODE process died before clients could start"
            tail -n 200 "$LOGS_DIR/$MODE.log" || true
            exit 1
          fi

          CLIENT_PIDS=()
          for i in $(seq 1 "$EXTERNAL_CLIENTS"); do
            echo "::group::Launching client $i"
            "${RUN[@]}" "$BIN" -batchmode -nographics \
              -role client \
              "${SCENARIO_ARGS[@]}" \
              -results "$RESULTS_DIR/client-$i.json" \
              -logFile "$LOGS_DIR/client-$i.log" &
            PID=$!
            CLIENT_PIDS+=("$PID")
            echo "Client $i PID: $PID"
            echo "::endgroup::"
          done

          FAIL=0

          for pid in "${CLIENT_PIDS[@]}"; do
            if wait "$pid"; then
              echo "Client PID $pid exited 0"
            else
              code=$?
              echo "::error::Client PID $pid exited $code"
              FAIL=1
            fi
          done

          if wait "$SERVER_PID"; then
            echo "$MODE process exited 0"
          else
            code=$?
            echo "::error::$MODE process exited $code"
            FAIL=1
          fi

          echo "::group::Result files"
          for f in "$RESULTS_DIR"/*.json; do
            [ -e "$f" ] || continue
            echo "----- $f -----"
            cat "$f"
            echo
          done
          echo "::endgroup::"

          # Cross-check the JSON: any scenario with success=false fails the run.
          if command -v jq >/dev/null 2>&1; then
            for f in "$RESULTS_DIR"/*.json; do
              [ -e "$f" ] || continue
              if jq -e 'any(.[]; .result.success == false)' "$f" >/dev/null; then
                echo "::error::$f contains a failed scenario"
                FAIL=1
              fi
            done
          fi

          # Some fatal networking/Unity failures can leave JSON looking incomplete or stale.
          # Keep this narrow: scenario assertions remain the main signal, logs catch hard failures.
          FATAL_LOG_PATTERN="CompleteSpawn: CreatePrototype failed|SceneID '[0-9]+' not found|Address already in use|UDPTransport Bind exception|Unhandled Exception|NullReferenceException|InvalidOperationException|Segmentation fault|SIGSEGV|Crash!!!|Native Crash Reporting"
          for f in "$LOGS_DIR"/*.log; do
            [ -e "$f" ] || continue
            if grep -E -n "$FATAL_LOG_PATTERN" "$f" >/tmp/purrnet-fatal-log-matches.txt; then
              echo "::error::$f contains fatal log patterns"
              cat /tmp/purrnet-fatal-log-matches.txt
              FAIL=1
            fi
          done

          exit $FAIL

      - name: Render results to job summary
        if: always()
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -u
          shopt -s nullglob
          files=(test-results/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            {
              echo "## Network Test Results"
              echo ""
              echo "_No result files were produced._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          JQ_LIB='
            def humanBytes:
              if . < 1024 then "\(.) B"
              elif . < 1048576 then "\(((. * 10) / 1024 | floor) / 10) KB"
              else "\(((. * 100) / 1048576 | floor) / 100) MB" end;
            def humanDuration:
              if . < 1000 then "\(((. * 10) | floor) / 10)ms"
              else "\(((. * 100) / 1000 | floor) / 100)s" end;
            def statusIcon:
              if . then ":white_check_mark:" else ":x:" end;
          '

          total=0
          passed=0
          for f in "${files[@]}"; do
            count=$(jq 'length' "$f")
            pass=$(jq '[.[] | select(.result.success == true)] | length' "$f")
            total=$((total + count))
            passed=$((passed + pass))
          done
          failed=$((total - passed))

          {
            echo "## Network Test Results — ${MODE} mode"
            echo ""
            if [ "$failed" -eq 0 ]; then
              echo "### :white_check_mark: All scenarios passed (${passed}/${total})"
            else
              echo "### :x: ${failed} failure(s) — ${passed}/${total} passed"
            fi
            echo ""

            for f in "${files[@]}"; do
              proc=$(basename "$f" .json)
              pcount=$(jq 'length' "$f")
              ppass=$(jq '[.[] | select(.result.success == true)] | length' "$f")
              pfail=$((pcount - ppass))

              # Client tables get loud with N near-identical rows; only show failed scenarios
              # for clients. The server/host file always renders in full so it's clear which
              # scenarios actually ran and how the authoritative side viewed each one.
              case "$proc" in
                client-*) is_client=1 ;;
                *)        is_client=0 ;;
              esac

              if [ "$is_client" -eq 1 ]; then
                if [ "$pfail" -eq 0 ]; then
                  echo "#### \`${proc}\` — ${ppass}/${pcount} passed :white_check_mark:"
                  echo ""
                  echo "_All scenarios passed; rows omitted._"
                  echo ""
                  continue
                fi
                echo "#### \`${proc}\` — ${pfail} failed (${ppass}/${pcount} passed)"
              else
                echo "#### \`${proc}\` — ${ppass}/${pcount} passed"
              fi
              echo ""
              echo "| # | Scenario | Status | Duration | Sent | Received | Message |"
              echo "|---|---|---|---|---|---|---|"

              FILTER='to_entries[]'
              if [ "$is_client" -eq 1 ]; then
                FILTER='to_entries[] | select(.value.result.success == false)'
              fi

              jq -r "$JQ_LIB"'
                '"$FILTER"' |
                "| \(.key) | \(.value.name // "?") | \(.value.result.success | statusIcon) | \(.value.durationInMs | humanDuration) | \(.value.dataSent | humanBytes) | \(.value.dataReceived | humanBytes) | \((.value.result.message // "") | gsub("\\|"; "&#124;") | gsub("[\\r\\n]+"; " ")) |"
              ' "$f"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tail logs on failure
        if: failure()
        run: |
          for f in test-logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f (last 200 lines)"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-test-artifacts-${{ matrix.mode }}
          path: |
            test-results/
            test-logs/
          if-no-files-found: warn
          retention-days: 14
